<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GV Vendas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>GV Vendas</h1>
    <p>Os melhores produtos em um só lugar!</p>
</header>

<section class="hero">
    <h2>Bem-vindo à GV Vendas</h2>
    <p>Confira nossos produtos</p>
</section>

<div class="search">
    <input type="text" placeholder="Pesquisar produto...">
</div>

<main class="produtos">

    <div class="produto">
        <img src="IMG_4554.jpeg" alt="Câmera de segurança">
        <h3>Câmera de Segurança</h3>
        <p>R$ 44,99</p>
        <a href="#" target="_blank">Ver produto</a>
    </div>

    <div class="produto">
        <img src="IMG_4553.jpeg" alt="Moletom">
        <h3>Moletom</h3>
        <p>R$ 50,32</p>
        <a href="#" target="_blank">Ver produto</a>
    </div>

    <div class="produto">
        <img src="IMG_4551.jpeg" alt="Fone Bluetooth">
        <h3>Fone Bluetooth</h3>
        <p>R$ 20,90</p>
        <a href="#" target="_blank">Ver produto</a>
    </div>

    <div class="produto">
        <img src="IMG_4546.jpeg" alt="Meias esportivas">
        <h3>Meias Esportivas</h3>
        <p>R$ 25,99</p>
        <a href="#" target="_blank">Ver produto</a>
    </div>

</main>

<footer>
    <p>© 2026 GV Vendas</p>
</footer>

</body>
</html>
